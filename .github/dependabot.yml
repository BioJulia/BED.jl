version: 2
updates:
  # Maintain Julia dependencies in the project root
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"

  # Maintain Julia dependencies for documentation
  - package-ecosystem: "julia"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
